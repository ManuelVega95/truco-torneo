<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/estilo.css">
<meta name="description=" content="Torneo de truco">
<title>Jugadores</title>
</head>
<body>

    <header>
        <nav class="navbar">
        <div class="nav-left">
            <h1>TORNEO DE TRUCO</h1>
        </div>
        <div class="nav-right">
            <a href="../index.html" class="nav-link">Inicio</a>
            <a href="../pages/fixture.html" class="nav-link">Fixture</a>
            <a href="../pages/jugadores.html" class="nav-link">Jugadores</a>
            <a href="../pages/historial.html" class="nav-link">Historial del Torneo</a>
            <a href="../pages/reglas.html" class="nav-link">Reglas</a>
        </div>
        </nav>
    </header>

    <main>
        <h1>Listado de Jugadores</h1>
        <div id="lista-jugadores" class="jugadores-grid"></div>

        <!-- MODAL -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="cerrar" onclick="cerrarModal()">×</span>

                <h2 id="modal-nombre"></h2>

                <!-- Filtros -->
                <div class="filtros-container">
                    <button class="filtro-btn activo" data-f="todos" onclick="cambiarFiltro('todos')">Todos</button>
                    <button class="filtro-btn" data-f="V" onclick="cambiarFiltro('V')">Victorias</button>
                    <button class="filtro-btn" data-f="E" onclick="cambiarFiltro('E')">Empates</button>
                    <button class="filtro-btn" data-f="D" onclick="cambiarFiltro('D')">Derrotas</button>
                </div>

                <div id="modal-historial"></div>
            </div>
        </div>
    </main>

    <footer>
    <div class="footer-container">
        <button id="btn-admin" onclick="activarAdmin()">Modo Admin</button>
        <button onclick="reiniciarTorneo()">Reiniciar Torneo</button>
        <button onclick="exportarTorneo()">Exportar Torneo</button>
        <label class="import-btn">
        Importar Torneo
        <input type="file" accept=".json" onchange="importarTorneo(this.files[0])" style="display:none;">
        </label>
    </div>
    </footer>

        <script src="../js/script.js"></script>
</body>
</html>
