<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/estilo.css">
  <meta name="description=" content="Torneo de truco">
  <title>Historial del Torneo</title>

<style>
  h2 { margin-top: 40px; }
  table { border-collapse: collapse; margin-top: 10px; width: 100%; }
  th, td { border: 1px solid #333; padding: 5px 10px; text-align: center; }
</style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="nav-left">
        <h1>TORNEO DE TRUCO</h1>
      </div>
      <div class="nav-right">
        <a href="../index.html" class="nav-link">Inicio</a>
        <a href="../pages/fixture.html" class="nav-link">Fixture</a>
        <a href="../pages/jugadores.html" class="nav-link">Jugadores</a>
        <a href="../pages/historial.html" class="nav-link">Historial del Torneo</a>
        <a href="../pages/reglas.html" class="nav-link">Reglas</a>
      </div>
    </nav>
  </header>

  <main>
  <h1>Historial del Torneo</h1>

  <div id="historial"></div>
  
  </main>

  <footer>
    <div class="footer-container">
      <button id="btn-admin" onclick="activarAdmin()">Modo Admin</button>
      <button onclick="reiniciarTorneo()">Reiniciar Torneo</button>
      <button onclick="exportarTorneo()">Exportar Torneo</button>
      <label class="import-btn">
        Importar Torneo
      <input type="file" accept=".json" onchange="importarTorneo(this.files[0])" style="display:none;">
      </label>
    </div>
  </footer>

  <script src="../js/script.js"></script>
  <script>
  const historial = JSON.parse(localStorage.getItem('historial')) || [];

  const cont = document.getElementById('historial');

  if (historial.length === 0) {
    cont.innerHTML = "<p>No hay resultados aún.</p>";
  } else {

    historial.forEach((tablaFecha, fIndex) => {

      const titulo = document.createElement('h2');
      titulo.textContent = `Tabla al finalizar Fecha ${fIndex + 1}`;
      cont.appendChild(titulo);

      const table = document.createElement('table');

      table.innerHTML = `
        <thead>
          <tr>
            <th>Pos</th>
            <th>Jugador</th>
            <th>PJ</th>
            <th>V</th>
            <th>E</th>
            <th>D</th>
            <th>Puntos</th>
            <th>Bonus</th>
            <th>Últimos 5 Partidos</th>
          </tr>
        </thead>
      `;

      const tbody = document.createElement("tbody");

      tablaFecha
        .sort((a, b) => b.puntos - a.puntos)
        .forEach((j, index) => {

          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${j.nombre}</td>
            <td>${j.PJ}</td>
            <td>${j.V}</td>
            <td>${j.E}</td>
            <td>${j.D}</td>
            <td>${j.puntos}</td>
            <td>${j.bonus}</td>
            <td>${(j.ultimos || []).join(" ")}</td>
          `;

          tbody.appendChild(tr);
        });

      table.appendChild(tbody);
      cont.appendChild(table);
    });
  }
</script>

</body>
</html>
