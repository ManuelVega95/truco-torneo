<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./fotos/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/estilo.css">
    <meta name="description=" content="Torneo de truco">
    <title>Torneos de Truco</title>
</head>
<body>

    <!-- <button onclick="reiniciarLimpio()">Reiniciar limpio</button>  -->
    <header>
        <nav class="navbar">
            <div class="nav-left">
            <h1>TORNEO DE TRUCO</h1>
            </div>
            <div class="nav-right">
            <button id="btn-admin" onclick="activarAdmin()">Modo Admin</button>
            <button onclick="reiniciarTorneo()">Reiniciar Torneo</button>
            <a href="./pages/historial.html" class="nav-link">Historial de Fechas</a>
            <a href="./pages/reglas.html" class="nav-link">Reglas</a>
            </div>
        </nav>
    </header>

    <main>
        <h2>Fecha Actual: <span id="fecha-num">1</span></h2>
            <div id="fecha-info">
            <span id="fecha-num"></span>
            <span id="boton-siguiente-container"></span>
            </div>

            <div id="partidos"></div>

            <h2>Tabla de Posiciones</h2>
            <table id="tabla">
            <thead>
                <tr>
                    <th>POS</th>
                    <th>Nombre</th>
                    <th>PJ</th>
                    <th>V</th>
                    <th>E</th>
                    <th>D</th>
                    <th>Pts</th>
                    <th>Bonus</th>
                    <th>Últimos 5 Partidos</th>
                </tr>
            </thead>
            <tbody></tbody>
            </table>


            <h2>Fixture Completo</h2>

            <label for="selector-fecha">Seleccionar Fecha:</label>
            <select id="selector-fecha"></select>
            <div id="fixture-completo"></div>
            
    </main>


    
    <footer>
        <div class="footer-container">
            <button onclick="exportarTorneo()">Exportar torneo</button>

            <label class="import-btn">
            Importar torneo
            <input type="file" accept=".json" onchange="importarTorneo(this.files[0])" style="display:none;">
            </label>
        </div>
</footer>
<script src="./js/script.js"></script>
</body>
</html>
